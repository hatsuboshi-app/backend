name: docs

on:
  workflow_call:
    inputs:
      docs_dir:
        description: Folder under public/ in the docs repo (api or api-dev)
        required: true
        type: string
      api_origin:
        description: Origin of the deployed API, used for the spec's servers
        required: true
        type: string
    secrets:
      DOCS_PUBLISH_TOKEN:
        required: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docs-${{ inputs.docs_dir }}-publish
      cancel-in-progress: true
    env:
      OUT_DIR: src/routes
      DOCS_DIR: ${{ inputs.docs_dir }}
      API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
      - name: Install dependencies & generate docs
        run: |
          npm clean-install
          npm audit signatures
          npm run tsoa
      - name: Post-process specs
        run: |
          for spec in "$OUT_DIR"/*/swagger.json; do
            jq --arg origin "$API_ORIGIN" '
              .servers = ((.servers // [{ url: "" }]) | map(
                .url |= if test("^https?://") then sub("^https?://[^/]+"; $origin) else $origin + . end
              ))
            ' "$spec" > "$spec.tmp"
            mv "$spec.tmp" "$spec"
          done
      - name: Checkout docs repo
        uses: actions/checkout@v7
        with:
          repository: hatsuboshi-app/docs
          token: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          path: docs-repo
      - name: Copy artifacts & build versions.json
        run: |
          TARGET="docs-repo/public/$DOCS_DIR"
          mkdir -p "$TARGET"
          rsync -a --delete --exclude /index.html "$OUT_DIR/" "$TARGET/"
          find "$OUT_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort -V \
            | jq -R -s -c 'split("\n") | map(select(length > 0))' \
            > "$TARGET/versions.json"
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: docs-repo
          commit_message: "docs(${{ inputs.docs_dir }}): publish ${{ github.sha }}"
          before_push_hook: |
            git pull --rebase